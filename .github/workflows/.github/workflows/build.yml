name: Build HookCase

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Compile HookCase Kext
        run: |
          xcodebuild -project HookCase.xcodeproj -target HookCase -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

      - name: Upload Finished Kext
        uses: actions/upload-artifact@v4
        with:
          name: HookCase-Kext
          path: build/Release/HookCase.kext
